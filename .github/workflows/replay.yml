name: Reproduce submissions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU replay dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce V52 and V58 and verify artifacts
        run: python scripts/reproduce.py --version all
      - name: Save verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: replay-verification
          path: outputs/
